<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>多言語翻訳サービス</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0 20px; /* Add left and right padding for consistent spacing */
      background-color: #f4f4f9;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #0078d7;
      color: #fff;
      padding: 20px 20px; /* Add left and right padding */
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2.5em;
      padding-left: 20px; /* Add left padding */
    }

    textarea {
      width: calc(100% - 40px); /* Add spacing from screen edges */
      height: 120px;
      margin: 20px; /* Add equal margin on all sides */
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
      padding-left: 20px; /* Add left padding */
    }

    #languageButtons, #speechLanguageButtons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 5px; /* Reduce gap between buttons */
      margin: 20px;
    }

    #languageButtons button {
      background: #fff; /* Default white color */
      color: #333;
      border: 1px solid #ccc;
      padding: 15px; /* Adjust padding for better appearance */
      border-radius: 5px;
      cursor: pointer;
      font-size: 2em; /* Increase font size for flags */
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    #languageButtons button.selected {
      background: #0078d7; /* Blue when selected */
      color: #fff;
    }

    #languageButtons button:hover {
      background: #005bb5; /* Darker blue on hover */
      color: #fff;
    }

    button {
      background: #ff0000; /* Red color for toggle button */
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
      margin: 20px;
    }

    button:hover {
      background: #cc0000; /* Darker red on hover */
    }

    #speechLanguageButtons button {
      background: #ffcccc; /* Light red background */
      color: #333;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 2em;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    #speechLanguageButtons button.selected {
      background: #0078d7; /* Blue when selected */
      color: #fff;
    }

    #speechLanguageButtons button:hover {
      background: #ff9999; /* Slightly darker red on hover */
      color: #fff;
    }

    #translateButton {
      background: #0078d7; /* Blue color for translate button */
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
      margin: 20px;
    }

    #translateButton:hover {
      background: #005bb5; /* Darker blue on hover */
    }

    #translations {
      margin-top: 20px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #translations p {
      margin: 10px 0;
      font-size: 1.1em;
    }

    #detectedLanguage {
      margin: 20px;
      padding: 10px;
      background-color: #e0e0e0; /* Gray background */
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1.2em;
      font-weight: bold;
    }

    /* Remove microphone button styles */
    #microphoneButton {
      display: none;
    }

    #speechRecognitionSection {
      display: none; /* Initially hidden */
      margin: 20px 20px 20px 20px; /* Add equal spacing from all edges */
    }
  </style>
</head>
<body>
  <h1>多言語翻訳サービス / Multi-Language Translation Service</h1>

  <button onclick="toggleSpeechRecognition()">音声認識を表示 / Toggle Speech Recognition</button>
  <div id="speechRecognitionSection">
    <label>音声認識の言語を選択 / Select Speech Recognition Language:</label>
    <p style="text-align: center; font-weight: bold;">Tap your language and start speaking</p>
    <div id="speechLanguageButtons">
      <button onclick="startSpeechRecognition('en-US')">🇬🇧</button>
      <button onclick="startSpeechRecognition('ja-JP')">🇯🇵</button>
      <button onclick="startSpeechRecognition('it-IT')">🇮🇹</button>
      <button onclick="startSpeechRecognition('fr-FR')">🇫🇷</button>
      <button onclick="startSpeechRecognition('es-ES')">🇪🇸</button>
      <button onclick="startSpeechRecognition('de-DE')">🇩🇪</button>
      <button onclick="startSpeechRecognition('ro-RO')">🇷🇴</button>
      <button onclick="startSpeechRecognition('zh-CN')">🇨🇳</button>
      <button onclick="startSpeechRecognition('ko-KR')">🇰🇷</button>
      <button onclick="startSpeechRecognition('ru-RU')">🇷🇺</button>
      <button onclick="startSpeechRecognition('pt-PT')">🇵🇹</button>
      <button onclick="startSpeechRecognition('ar-SA')">🇸🇦</button>
    </div>
  </div>

  <textarea id="inputText" placeholder="音声で話すか、テキストを入力してください。テキスト入力はすべての言語に対応しています。 / Speak or type the text to be translated. Text input supports all languages." onkeypress="if(event.key === 'Enter') translateText();"></textarea>
  
  <label>翻訳先の言語を選択 / Select target languages:</label>
  <div id="languageButtons">
    <button onclick="toggleLanguage(this, 'en')">🇬🇧</button>
    <button onclick="toggleLanguage(this, 'ja')">🇯🇵</button>
    <button onclick="toggleLanguage(this, 'it')">🇮🇹</button>
    <button onclick="toggleLanguage(this, 'fr')">🇫🇷</button>
    <button onclick="toggleLanguage(this, 'es')">🇪🇸</button>
    <button onclick="toggleLanguage(this, 'de')">🇩🇪</button>
    <button onclick="toggleLanguage(this, 'ro')">🇷🇴</button>
    <button onclick="toggleLanguage(this, 'zh')">🇨🇳</button>
    <button onclick="toggleLanguage(this, 'ko')">🇰🇷</button>
    <button onclick="toggleLanguage(this, 'ru')">🇷🇺</button>
    <button onclick="toggleLanguage(this, 'pt')">🇵🇹</button>
    <button onclick="toggleLanguage(this, 'ar')">🇸🇦</button>
  </div>
  <br>
  <button id="translateButton" onclick="translateText()">翻訳 / Translate</button>
  
  <div id="detectedLanguage" style="display: none;">Detected Language: </div>
  <div id="translations"></div>
  
  <script>
    const selectedLanguages = new Set(['en', 'ja']); // Default selected languages: English and Japanese

    function toggleLanguage(button, lang) {
      if (selectedLanguages.has(lang)) {
        selectedLanguages.delete(lang);
        button.classList.remove('selected');
      } else {
        selectedLanguages.add(lang);
        button.classList.add('selected');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Automatically mark English and Japanese buttons as selected
      document.querySelectorAll('#languageButtons button').forEach(button => {
        const lang = button.textContent.trim();
        if (lang === '🇬🇧' || lang === '🇯🇵') {
          button.classList.add('selected');
        }
      });
    });

    function translateText() {
      const text = document.getElementById('inputText').value;
      const targetLanguages = Array.from(selectedLanguages);

      if (!text) {
        alert('翻訳するテキストを入力してください。/Please enter text to translate.');
        return;
      }

      if (targetLanguages.length === 0) {
        alert('少なくとも1つの翻訳先言語を選択してください。/ Please select at least one target language.');
        return;
      }

      fetch('/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, target_languages: targetLanguages })
      })
      .then(response => response.json())
      .then(data => {
        const translationsDiv = document.getElementById('translations');
        const detectedLanguageDiv = document.getElementById('detectedLanguage');

        translationsDiv.innerHTML = '';
        detectedLanguageDiv.style.display = 'block';
        detectedLanguageDiv.textContent = `Detected Language: ${data.source_language}`;

        const languageNames = {
          en: '🇬🇧 English',
          ja: '🇯🇵 Japanese',
          it: '🇮🇹 Italian',
          fr: '🇫🇷 French',
          es: '🇪🇸 Spanish',
          de: '🇩🇪 German',
          ro: '🇷🇴 Romanian',
          zh: '🇨🇳 Chinese',
          ko: '🇰🇷 Korean',
          ru: '🇷🇺 Russian',
          pt: '🇵🇹 Portuguese',
          ar: '🇸🇦 Arabic'
        };
        for (const [lang, translation] of Object.entries(data)) {
          if (lang === 'source_language') continue;

          const p = document.createElement('p');
          p.textContent = `${languageNames[lang]}: ${translation}`;
          translationsDiv.appendChild(p);

          const playButton = document.createElement('button');
          playButton.textContent = '再生 / Play';
          playButton.style.backgroundColor = '#0078d7'; // Blue color for play button
          playButton.style.color = '#fff'; // White text color
          playButton.style.border = 'none';
          playButton.style.padding = '10px 20px';
          playButton.style.borderRadius = '5px';
          playButton.style.cursor = 'pointer';
          playButton.style.fontSize = '1em';
          playButton.style.transition = 'background 0.3s';
          playButton.onmouseover = () => playButton.style.backgroundColor = '#005bb5'; // Darker blue on hover
          playButton.onmouseout = () => playButton.style.backgroundColor = '#0078d7'; // Reset to blue
          playButton.onclick = () => {
            const utterance = new SpeechSynthesisUtterance(translation);
            utterance.lang = lang;
            speechSynthesis.speak(utterance);
          };
          translationsDiv.appendChild(playButton);
        }
      })
      .catch(error => {
        console.error('エラーが発生しました:', error);
        alert('翻訳中にエラーが発生しました。');
      });
    }

    function startSpeechRecognition(lang) {
      if (!('webkitSpeechRecognition' in window)) {
        alert('このブラウザは音声認識をサポートしていません。/ This browser does not support speech recognition.');
        return;
      }

      const recognition = new webkitSpeechRecognition();
      recognition.lang = lang; // Set the language dynamically based on button click
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        console.log(`音声認識を開始しました。言語: ${lang} / Speech recognition started. Language: ${lang}`);
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        console.log('認識結果:', transcript);
        document.getElementById('inputText').value = transcript;
      };

      recognition.onerror = (event) => {
        console.error('音声認識エラー:', event.error);
        alert('音声認識中にエラーが発生しました。/ An error occurred during speech recognition.');
      };

      recognition.onend = () => {
        console.log('音声認識を終了しました。/ Speech recognition ended.');
      };

      recognition.start();
    }

    function toggleSpeechRecognition() {
      const section = document.getElementById('speechRecognitionSection');
      if (section.style.display === 'none' || section.style.display === '') {
        section.style.display = 'block';
      } else {
        section.style.display = 'none';
      }
    }
  </script>
</body>
</html>
